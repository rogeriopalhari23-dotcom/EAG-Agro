name = "eag-compass"
type = "service"
main = "src/index.ts"
compatibility_date = "2024-12-19"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "eag_compass"
database_id = "eag_compass_main"

[[kv_namespaces]]
binding = "KV_CACHE"
id = "eag_cache"
preview_id = "eag_cache_preview"

[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "eag-compass-data"
preview_bucket_name = "eag-compass-data-preview"

[[queues.producers]]
binding = "QUEUE_SCORES"
queue = "eag-scores-queue"

[[queues.producers]]
binding = "QUEUE_SANCTIONS"
queue = "eag-sanctions-queue"

[[triggers.crons]]
cron = "0 */6 * * *"

[env.development]
vars = { ENVIRONMENT = "development", API_TIMEOUT = "30000", LOG_LEVEL = "debug", TENANT_ID = "eag-internal" }

[env.production]
vars = { ENVIRONMENT = "production", API_TIMEOUT = "15000", LOG_LEVEL = "info", TENANT_ID = "eag-internal" }

[build]
command = "npm install && npm run build"
cwd = "."
watch_paths = ["src/**/*.ts"]

[build.upload]
main = "dist/index.js"
